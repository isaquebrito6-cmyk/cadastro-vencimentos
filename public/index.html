<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Vencimentos · ASO & NRs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='13' fill='%2315171a'/><path d='M32 9 C38 12.5 44 14 50 14 C50 31 47 42.5 32 55 C17 42.5 14 31 14 14 C20 14 26 12.5 32 9 Z' fill='%23f2b705'/></svg>">
<meta name="theme-color" content="#15171a">
<style>
:root{--bg:#15171a;--panel:#1c1f23;--panel2:#22262b;--line:#33383e;--text:#eceae4;--dim:#9aa0a8;--amber:#f2b705;--red:#e2483a;--orange:#f2954a;--green:#3fae5c}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:3px;font-weight:600;cursor:pointer;font-size:13px}
.btn.primary{background:var(--amber);color:#15171a;border-color:var(--amber)}
.btn.ghost{background:transparent}
.btn:hover{border-color:var(--amber)}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:3px;font-size:13px;width:100%}
label{display:block;font-size:11px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:600}
.field{margin-bottom:12px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px}
h1{font-size:22px;margin:0 0 8px}
.sub{color:var(--dim);font-size:13px;margin:0 0 18px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
#app{display:none;padding:20px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-size:11px;text-transform:uppercase}
.chip{display:inline-block;padding:2px 7px;border-radius:2px;font-size:11px;font-weight:700;margin:2px;color:#15171a}
.chip.ok{background:var(--green)}.chip.warn{background:var(--orange)}.chip.bad{background:var(--red)}.chip.none{background:#555;color:#ccc}
.edit-box{background:#181a1d;padding:16px;border:1px solid var(--line);border-radius:4px;margin-top:8px}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--amber);padding:12px 16px;border-radius:4px;opacity:0;transition:.2s;z-index:50}
.toast.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;width:100%;max-width:420px}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <p class="sub" style="color:var(--amber);letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-bottom:6px">Verzani e Sandrini · Segurança do Trabalho</p>
    <h1>Cadastro de Vencimentos</h1>
    <p class="sub">ASO, NRs e treinamentos</p>
    <div class="field"><label>Usuário</label><input id="user" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="pass" type="password" autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" style="width:100%">Entrar</button>
  </div>
</div>

<div id="app">
  <header>
    <div>
      <div style="color:var(--amber);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600">ASO & NRs</div>
      <h1 style="margin:4px 0 0;font-size:20px" id="titulo">Cadastro de Vencimentos</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="empresaSel" style="display:none;width:auto;min-width:150px"></select>
      <span id="userLbl" style="color:var(--dim);font-size:13px"></span>
      <button class="btn ghost" id="logoutBtn">Sair</button>
    </div>
  </header>
  <div class="toolbar">
    <input id="busca" placeholder="Buscar..." style="flex:1;min-width:140px">
    <button class="btn primary" id="novoBtn">＋ Novo</button>
    <button class="btn" id="refreshBtn">Atualizar</button>
    <button class="btn ghost" id="novaEmpBtn" style="display:none">＋ Empresa</button>
  </div>
  <div style="overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)">
    <table>
      <thead><tr><th>Nome</th><th>Documentos (NRs)</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p id="count" style="color:var(--dim);font-size:12px;margin-top:10px"></p>
</div>

<div class="modal" id="editModal">
  <div class="box">
    <h2 style="margin:0 0 14px;font-size:17px" id="editTitle">Colaborador</h2>
    <div class="field"><label>Nome completo</label><input id="editNome"></div>
    <div class="field"><label>Observações</label><input id="editNotas" placeholder="opcional"></div>
    <div class="edit-grid" id="editDocs"></div>
    <div class="err" id="editErr"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" id="editCancel">Cancelar</button>
      <button class="btn primary" id="editSave">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TK='cv_token';
let TOKEN=localStorage.getItem(TK)||'';
let DATA=[], DOCS=[], ROLE='', USER='', EMPRESA=null, EMPRESAS=[], EDIT_ID=null, AVISO=30;

function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
function fmt(d){if(!d)return '—';const [y,m,day]=d.split('-');return day+'/'+m+'/'+y;}
function status(d){
  if(!d)return 'none';
  const t=new Date(d+'T12:00:00');const hoje=new Date();hoje.setHours(12,0,0,0);
  const dias=Math.round((t-hoje)/86400000);
  if(dias<0)return 'bad';if(dias<=AVISO)return 'warn';return 'ok';
}
async function api(path,opts={}){
  const headers={'content-type':'application/json',...(opts.headers||{})};
  if(TOKEN)headers.authorization='Bearer '+TOKEN;
  let url=path;
  if(EMPRESA&&EMPRESA.id&&path.startsWith('/api/')&&path!=='/api/login'&&!path.startsWith('/api/empresas')){
    url+=(path.includes('?')?'&':'?')+'empresa_id='+EMPRESA.id;
  }
  const res=await fetch(url,{...opts,headers});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||data.msg||('HTTP '+res.status));
  return data;
}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';}
function showLogin(msg){TOKEN='';localStorage.removeItem(TK);document.getElementById('login').style.display='flex';document.getElementById('app').style.display='none';if(msg)document.getElementById('loginErr').textContent=msg;}

async function login(){
  const username=document.getElementById('user').value.trim();
  const password=document.getElementById('pass').value;
  const err=document.getElementById('loginErr');err.textContent='';
  try{
    const data=await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});
    TOKEN=data.token;localStorage.setItem(TK,TOKEN);USER=data.username;ROLE=data.role;
    showApp();await load();
  }catch(e){
    err.textContent=e.message==='invalid_credentials'?'Usuário ou senha incorretos.':(e.message||'Falha no login');
  }
}

async function load(){
  try{
    const data=await api('/api/data');
    DATA=data.colaboradores||[];
    DOCS=data.docTypes||[];
    ROLE=data.role;USER=data.username;
    EMPRESA=data.empresaAtual;
    EMPRESAS=data.empresas||[];
    if(data.config&&data.config.avisoDias)AVISO=parseInt(data.config.avisoDias,10)||30;
    document.getElementById('userLbl').textContent=USER+(ROLE==='admin'?' · admin':'');
    document.getElementById('titulo').textContent=(EMPRESA&&EMPRESA.nome)||'Cadastro de Vencimentos';
    const sel=document.getElementById('empresaSel');
    const novaEmp=document.getElementById('novaEmpBtn');
    if(ROLE==='admin'&&EMPRESAS.length){
      sel.style.display='';novaEmp.style.display='';
      sel.innerHTML=EMPRESAS.map(e=>'<option value="'+e.id+'"'+(EMPRESA&&e.id===EMPRESA.id?' selected':'')+'>'+esc(e.nome)+'</option>').join('');
    }else{sel.style.display='none';novaEmp.style.display='none';}
    render();
  }catch(e){
    if(String(e.message).includes('unauthorized'))showLogin('Sessão expirada.');
    else toast('Erro: '+e.message);
  }
}

function render(){
  const q=(document.getElementById('busca').value||'').toLowerCase();
  const rows=DATA.filter(e=>!q||(e.nome||'').toLowerCase().includes(q)||(e.notas||[]).join(' ').toLowerCase().includes(q));
  const tb=document.getElementById('tbody');
  if(!rows.length){tb.innerHTML='<tr><td colspan="3" style="padding:28px;text-align:center;color:var(--dim)">Nenhum colaborador</td></tr>';}
  else{
    tb.innerHTML=rows.map(e=>{
      const chips=DOCS.map(d=>{
        const st=status(e.docs&&e.docs[d.sigla]);
        const cls=st==='ok'?'ok':st==='warn'?'warn':st==='bad'?'bad':'none';
        const title=d.sigla+' · '+(e.docs&&e.docs[d.sigla]?fmt(e.docs[d.sigla]):'não informado');
        return '<span class="chip '+cls+'" title="'+esc(title)+'">'+esc(d.sigla)+'</span>';
      }).join('');
      const notas=(e.notas&&e.notas.length)?'<div style="font-size:11px;color:var(--dim);margin-top:3px">'+esc(e.notas.join(', '))+'</div>':'';
      return '<tr><td style="font-weight:600">'+esc(e.nome)+notas+'</td><td>'+chips+'</td><td style="white-space:nowrap"><button class="btn" data-edit="'+esc(e.id)+'" style="padding:4px 8px;font-size:12px">Editar</button> <button class="btn" data-del="'+esc(e.id)+'" style="padding:4px 8px;font-size:12px">Excluir</button></td></tr>';
    }).join('');
  }
  document.getElementById('count').textContent=rows.length+' de '+DATA.length+' colaboradores · '+DOCS.length+' tipos de documento';
  tb.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Mover para a lixeira?'))return;
    try{await api('/api/colaborador?id='+encodeURIComponent(b.dataset.del),{method:'DELETE'});toast('Movido para a lixeira');await load();}catch(e){toast('Erro: '+e.message);}
  });
}

function openEdit(id){
  EDIT_ID=id==='new'?null:id;
  const e=EDIT_ID?DATA.find(x=>x.id===EDIT_ID):{nome:'',notas:[],docs:{}};
  if(!e&&EDIT_ID)return;
  document.getElementById('editTitle').textContent=EDIT_ID?'Editar colaborador':'Novo colaborador';
  document.getElementById('editNome').value=e.nome||'';
  document.getElementById('editNotas').value=(e.notas||[]).join(', ');
  document.getElementById('editErr').textContent='';
  document.getElementById('editDocs').innerHTML=DOCS.map(d=>{
    const v=(e.docs&&e.docs[d.sigla])||'';
    return '<div class="field"><label>'+esc(d.sigla)+'</label><input type="date" data-sigla="'+esc(d.sigla)+'" value="'+esc(v)+'"></div>';
  }).join('');
  document.getElementById('editModal').classList.add('show');
}

async function saveEdit(){
  const nome=document.getElementById('editNome').value.trim();
  if(!nome){document.getElementById('editErr').textContent='Informe o nome.';return;}
  const notasRaw=document.getElementById('editNotas').value.trim();
  const notas=notasRaw?notasRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
  const docs={};
  document.querySelectorAll('#editDocs [data-sigla]').forEach(inp=>{docs[inp.dataset.sigla]=inp.value||null;});
  try{
    await api('/api/colaborador',{method:'POST',body:JSON.stringify({id:EDIT_ID,nome,notas,docs})});
    document.getElementById('editModal').classList.remove('show');
    toast('Salvo');
    await load();
  }catch(e){document.getElementById('editErr').textContent=e.message;}
}

async function novaEmpresa(){
  const nome=prompt('Nome da nova empresa:');
  if(!nome||!nome.trim())return;
  try{
    await api('/api/empresas',{method:'POST',body:JSON.stringify({nome:nome.trim()})});
    toast('Empresa criada');
    await load();
  }catch(e){toast('Erro: '+e.message);}
}

document.getElementById('loginBtn').onclick=login;
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('logoutBtn').onclick=()=>showLogin();
document.getElementById('refreshBtn').onclick=load;
document.getElementById('novoBtn').onclick=()=>openEdit('new');
document.getElementById('busca').oninput=render;
document.getElementById('editCancel').onclick=()=>document.getElementById('editModal').classList.remove('show');
document.getElementById('editSave').onclick=saveEdit;
document.getElementById('novaEmpBtn').onclick=novaEmpresa;
document.getElementById('empresaSel').onchange=async function(){
  EMPRESA={id:parseInt(this.value,10)};await load();
};

(async()=>{if(TOKEN){try{showApp();await load();return;}catch(_){}}showLogin();})();
</script>
</body>
</html>
