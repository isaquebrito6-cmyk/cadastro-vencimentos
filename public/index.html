<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Vencimentos · ASO & NRs — Verzani e Sandrini</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='13' fill='%2315171a'/><path d='M32 9 C38 12.5 44 14 50 14 C50 31 47 42.5 32 55 C17 42.5 14 31 14 14 C20 14 26 12.5 32 9 Z' fill='%23f2b705'/><path d='M24.5 32 L29.5 37.5 L40 25.5' fill='none' stroke='%2315171a' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#15171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#15171a;--bg-panel:#1c1f23;--bg-panel-2:#22262b;--line:#33383e;--text:#eceae4;--text-dim:#9aa0a8;--amber:#f2b705;--amber-dim:#c99a06;--red:#e2483a;--radius:3px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
.btn{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:var(--radius);font-weight:600;cursor:pointer}
.btn.primary{background:var(--amber);color:#15171a;border-color:var(--amber)}
.btn:hover{border-color:var(--amber-dim)}
input{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:var(--radius);width:100%;font-size:14px}
input:focus{outline:1px solid var(--amber);border-color:var(--amber)}
label{display:block;font-size:11px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;font-weight:600}
.field{margin-bottom:14px}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:360px;background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;padding:28px}
h1{font-size:22px;margin:0 0 8px}
.sub{color:var(--text-dim);font-size:13px;margin:0 0 20px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
#appRoot{display:none;padding:20px;max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--text-dim);font-size:11px;text-transform:uppercase}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg-panel);border:1px solid var(--amber-dim);padding:12px 16px;border-radius:4px;opacity:0;transition:.2s;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="card">
    <p class="sub" style="color:var(--amber);letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-bottom:6px">Verzani e Sandrini · Segurança do Trabalho</p>
    <h1>Cadastro de Vencimentos</h1>
    <p class="sub">Entre com seu usuário e senha</p>
    <div class="field"><label>Usuário</label><input id="loginUser" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" style="width:100%">Entrar</button>
  </div>
</div>
<div id="appRoot">
  <header>
    <div>
      <div style="color:var(--amber);font-size:11px;letter-spacing:.12em;text-transform:uppercase">ASO & NRs</div>
      <h1 style="margin:4px 0 0;font-size:20px" id="empresaTitulo">Cadastro de Vencimentos</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="userLabel" style="color:var(--text-dim);font-size:13px"></span>
      <button class="btn" id="logoutBtn">Sair</button>
    </div>
  </header>
  <div class="toolbar">
    <input id="busca" placeholder="Buscar colaborador..." style="flex:1;min-width:160px">
    <button class="btn primary" id="novoBtn">＋ Novo</button>
    <button class="btn" id="refreshBtn">Atualizar</button>
  </div>
  <div style="overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg-panel)">
    <table>
      <thead><tr><th>Nome</th><th>Função</th><th>Docs</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p id="count" style="color:var(--text-dim);font-size:12px;margin-top:10px"></p>
</div>
<div class="toast" id="toast"></div>
<script>
const TOKEN_KEY = 'cv_token';
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
let DATA = [], DOC_TYPES = {}, ROLE = '', USER = '', EMPRESA = null;

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
async function api(path, opts = {}){
  const headers = { 'content-type': 'application/json', ...(opts.headers||{}) };
  if (TOKEN) headers.authorization = 'Bearer ' + TOKEN;
  let url = path;
  if (EMPRESA && EMPRESA.id && path.startsWith('/api/') && path !== '/api/login') {
    url += (path.includes('?') ? '&' : '?') + 'empresa_id=' + EMPRESA.id;
  }
  const res = await fetch(url, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.msg || ('HTTP ' + res.status));
  return data;
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
}
function showLogin(msg){
  TOKEN = ''; localStorage.removeItem(TOKEN_KEY);
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appRoot').style.display = 'none';
  if (msg) document.getElementById('loginErr').textContent = msg;
}
async function login(){
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  try {
    const data = await api('/api/login', { method:'POST', body: JSON.stringify({ username, password }) });
    TOKEN = data.token; localStorage.setItem(TOKEN_KEY, TOKEN);
    USER = data.username; ROLE = data.role;
    showApp();
    await load();
  } catch (e) {
    err.textContent = e.message === 'invalid_credentials' ? 'Usuário ou senha incorretos.' : (e.message || 'Falha no login');
  }
}
async function load(){
  try {
    const data = await api('/api/data');
    DATA = data.colaboradores || [];
    DOC_TYPES = {};
    (data.docTypes||[]).forEach(d => { DOC_TYPES[d.sigla] = d; });
    ROLE = data.role; USER = data.username;
    EMPRESA = data.empresaAtual;
    document.getElementById('userLabel').textContent = USER + (ROLE === 'admin' ? ' · admin' : '');
    document.getElementById('empresaTitulo').textContent = (EMPRESA && EMPRESA.nome) || 'Cadastro de Vencimentos';
    render();
  } catch (e) {
    if (String(e.message).includes('unauthorized')) showLogin('Sessão expirada. Entre de novo.');
    else toast('Erro ao carregar: ' + e.message);
  }
}
function render(){
  const q = (document.getElementById('busca').value || '').toLowerCase();
  const rows = DATA.filter(e => !q || (e.nome||'').toLowerCase().includes(q) || (e.funcao||'').toLowerCase().includes(q));
  const tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="4" style="color:var(--text-dim);padding:28px;text-align:center">Nenhum colaborador</td></tr>';
  } else {
    tb.innerHTML = rows.map(e => {
      const docs = Object.keys(e.docs||{}).filter(s => e.docs[s]).map(s => s).join(', ') || '—';
      return '<tr>' +
        '<td style="font-weight:600">' + esc(e.nome) + '</td>' +
        '<td style="color:var(--text-dim)">' + esc(e.funcao||'—') + '</td>' +
        '<td style="font-size:12px;color:var(--text-dim)">' + esc(docs) + '</td>' +
        '<td><button class="btn" data-del="' + esc(e.id) + '" style="padding:4px 8px;font-size:12px">Excluir</button></td>' +
      '</tr>';
    }).join('');
  }
  document.getElementById('count').textContent = rows.length + ' de ' + DATA.length + ' colaboradores';
  tb.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Mover para a lixeira?')) return;
    try {
      await api('/api/colaborador?id=' + encodeURIComponent(btn.dataset.del), { method:'DELETE' });
      toast('Movido para a lixeira');
      await load();
    } catch (e) { toast('Erro: ' + e.message); }
  });
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
async function novo(){
  const nome = prompt('Nome completo do colaborador:');
  if (!nome || !nome.trim()) return;
  const funcao = prompt('Função / cargo (opcional):') || '';
  try {
    await api('/api/colaborador', { method:'POST', body: JSON.stringify({ nome: nome.trim(), funcao: funcao.trim(), notas: [], docs: {} }) });
    toast('Colaborador criado');
    await load();
  } catch (e) { toast('Erro: ' + e.message); }
}
document.getElementById('loginBtn').onclick = login;
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('logoutBtn').onclick = () => showLogin();
document.getElementById('refreshBtn').onclick = load;
document.getElementById('novoBtn').onclick = novo;
document.getElementById('busca').oninput = render;
(async () => {
  if (TOKEN) {
    try { showApp(); await load(); return; } catch (_) {}
  }
  showLogin();
})();
</script>
</body>
</html>
